{% extends 'base.html' %}

{% block title %}Delete {{ place.name }} | Daanan{% endblock %}

{% block content %}
<h1>Delete Place</h1>
<p>Are you sure you want to delete <strong>{{ place.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'places:detail' pk=place.pk %}">Cancel</a>
</form>
{% endblock %}
